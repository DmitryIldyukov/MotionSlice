name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - 'release/**'
      - 'hotfix/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  # ============================================================================
  # JOB 1: BUILD - Сборка проекта
  # ============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    
    # Пропускаем build для release/hotfix веток
    if: |
      !startsWith(github.ref, 'refs/heads/release/') &&
      !startsWith(github.ref, 'refs/heads/hotfix/')
    
    steps:
      # Скачиваем код с GitHub
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Устанавливаем .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      # Восстанавливаем NuGet зависимости
      - name: Restore dependencies
        run: dotnet restore
      
      # Собираем проект
      - name: Build project
        run: dotnet build --no-restore --configuration Release

  # ============================================================================
  # JOB 2: TEST - Запуск тестов
  # ============================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    
    # Пропускаем тесты для release/hotfix веток
    if: |
      !startsWith(github.ref, 'refs/heads/release/') &&
      !startsWith(github.ref, 'refs/heads/hotfix/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore
      
      # Запускаем тесты
      - name: Run tests
        run: dotnet test --no-restore --logger "trx;LogFileName=test-results.trx"
      
      # Загружаем результаты тестов (опционально)
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: .NET Test Results
          path: '**/test-results.trx'
          reporter: 'dotnet trx'

  # ============================================================================
  # JOB 3: RELEASE MERGE - Мержа релизной ветки
  # ============================================================================
  release-merge:
    name: Merge Release to Main
    runs-on: ubuntu-latest
    
    # Запускаем ТОЛЬКО для release веток и ТОЛЬКО вручную
    if: startsWith(github.ref, 'refs/heads/release/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Получаем всю историю
      
      # Настраиваем git
      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      
      # Получаем последние изменения
      - name: Fetch all branches
        run: git fetch origin
      
      # Мержим release в main
      - name: Merge release to main
        run: |
          git checkout main
          git merge --no-ff ${{ github.ref_name }} -m "Merge ${{ github.ref_name }} into main"
          git push origin main
      
      # Мержим release обратно в dev
      - name: Merge release back to dev
        run: |
          git checkout dev
          git merge --no-ff ${{ github.ref_name }} -m "Merge ${{ github.ref_name }} back to dev"
          git push origin dev
      
      # Удаляем release ветку
      - name: Delete release branch
        run: git push origin --delete ${{ github.ref_name }}

  # ============================================================================
  # JOB 4: HOTFIX MERGE - Мержа хотфикса
  # ============================================================================
  hotfix-merge:
    name: Merge Hotfix to Main and Dev
    runs-on: ubuntu-latest
    
    # Запускаем ТОЛЬКО для hotfix веток
    if: startsWith(github.ref, 'refs/heads/hotfix/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      
      - name: Fetch all branches
        run: git fetch origin
      
      # Мержим hotfix в main
      - name: Merge hotfix to main
        run: |
          git checkout main
          git merge --no-ff ${{ github.ref_name }} -m "Merge ${{ github.ref_name }} into main"
          git push origin main
      
      # Мержим hotfix в dev
      - name: Merge hotfix to dev
        run: |
          git checkout dev
          git merge --no-ff ${{ github.ref_name }} -m "Merge ${{ github.ref_name }} into dev"
          git push origin dev
      
      # Удаляем hotfix ветку
      - name: Delete hotfix branch
        run: git push origin --delete ${{ github.ref_name }}