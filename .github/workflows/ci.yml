name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - 'release/**'
      - 'hotfix/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  # ============================================================================
  # JOB 1: BUILD
  # ============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build project
        run: dotnet build --no-restore --configuration Release
  # ============================================================================
  # JOB 2: TEST - Тесты для ВСЕХ веток (включая release/hotfix)
  # ============================================================================
  # Пока что тестов нет


  # ============================================================================
  # JOB 3: RELEASE MERGE
  # ============================================================================
  release-merge:
    name: Merge Release to Main
    runs-on: ubuntu-latest
    
    # Запускаем ТОЛЬКО для release веток
    if: startsWith(github.ref, 'refs/heads/release/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      
      - name: Fetch all branches
        run: git fetch origin
      
      - name: Merge release to main
        run: |
          git checkout main
          git merge --no-ff ${{ github.ref_name }} -m "Merge ${{ github.ref_name }} into main"
          git push origin main
      
      - name: Merge release back to dev
        run: |
          git checkout dev
          git merge --no-ff ${{ github.ref_name }} -m "Merge ${{ github.ref_name }} back to dev"
          git push origin dev
      
      - name: Delete release branch
        run: git push origin --delete ${{ github.ref_name }}

  # ============================================================================
  # JOB 4: HOTFIX MERGE
  # ============================================================================
  hotfix-merge:
    name: Merge Hotfix to Main and Dev
    runs-on: ubuntu-latest
    
    if: startsWith(github.ref, 'refs/heads/hotfix/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      
      - name: Fetch all branches
        run: git fetch origin
      
      - name: Merge hotfix to main
        run: |
          git checkout main
          git merge --no-ff ${{ github.ref_name }} -m "Merge ${{ github.ref_name }} into main"
          git push origin main
      
      - name: Merge hotfix to dev
        run: |
          git checkout dev
          git merge --no-ff ${{ github.ref_name }} -m "Merge ${{ github.ref_name }} into dev"
          git push origin dev
      
      - name: Delete hotfix branch
        run: git push origin --delete ${{ github.ref_name }}
